<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AIリカバリーコーチ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background: #f0f4f8; color: #1a2a3a; min-height: 100vh; }

  .header { background: linear-gradient(135deg, #0ea5e9, #0369a1); color: white; padding: 20px 16px 16px; text-align: center; }
  .header h1 { font-size: 1.3em; font-weight: 700; }
  .header p { font-size: 0.85em; opacity: 0.85; margin-top: 4px; }

  .tabs { display: flex; background: white; border-bottom: 2px solid #e2e8f0; }
  .tab { flex: 1; padding: 14px 8px; text-align: center; font-size: 0.85em; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #0369a1; border-bottom-color: #0369a1; }

  .page { display: none; padding: 16px; max-width: 480px; margin: 0 auto; }
  .page.active { display: block; }

  .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); }
  .card h2 { font-size: 0.95em; color: #0369a1; font-weight: 700; margin-bottom: 12px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.82em; color: #64748b; font-weight: 600; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 1em; background: #f8fafc; transition: border 0.2s;
  }
  .field input:focus, .field select:focus { outline: none; border-color: #0369a1; background: white; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .photo-area {
    border: 2px dashed #cbd5e1; border-radius: 10px; padding: 24px 16px;
    text-align: center; cursor: pointer; transition: all 0.2s; background: #f8fafc;
  }
  .photo-area:hover { border-color: #0369a1; background: #eff6ff; }
  .photo-area.has-image { border-style: solid; border-color: #0369a1; padding: 8px; }
  .photo-area img { max-width: 100%; border-radius: 8px; display: block; }
  .photo-area .icon { font-size: 2em; margin-bottom: 8px; }
  .photo-area p { font-size: 0.85em; color: #94a3b8; }

  .btn-meal {
    width: 100%; padding: 12px; background: linear-gradient(135deg, #0ea5e9, #0369a1);
    color: white; border: none; border-radius: 10px; font-size: 0.95em;
    font-weight: 700; cursor: pointer; margin-top: 10px;
  }
  .btn-meal:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-meal.done { background: linear-gradient(135deg, #22c55e, #16a34a); }

  .meal-done-box { background: #f0fdf4; border-radius: 10px; padding: 12px; margin-top: 10px; border-left: 3px solid #22c55e; }
  .meal-done-box .done-label { font-size: 0.78em; color: #16a34a; font-weight: 700; margin-bottom: 4px; }
  .meal-done-box p { font-size: 0.85em; color: #166534; line-height: 1.6; }

  .advice-box { background: linear-gradient(135deg, #eff6ff, #dbeafe); border-radius: 12px; padding: 18px; border-left: 4px solid #0369a1; margin-top: 14px; }
  .advice-box .label { font-size: 0.78em; color: #0369a1; font-weight: 700; margin-bottom: 8px; }
  .advice-box p { font-size: 0.95em; line-height: 1.8; color: #1e3a5f; }

  .loading-inline { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
  .spinner-sm { width: 20px; height: 20px; border: 3px solid #e2e8f0; border-top-color: #0369a1; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hrv-display { text-align: center; padding: 8px 0; }
  .hrv-display .num { font-size: 3em; font-weight: 700; color: #0369a1; }
  .hrv-display .sub { font-size: 0.8em; color: #94a3b8; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag { background: #e0f2fe; color: #0369a1; border-radius: 20px; padding: 3px 10px; font-size: 0.78em; font-weight: 600; }
  .meal-result { background: #f0fdf4; border-radius: 8px; padding: 10px 12px; margin-top: 8px; border-left: 3px solid #22c55e; font-size: 0.85em; color: #166534; line-height: 1.6; }

  .history-item { background: white; border-radius: 10px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .history-item .date { font-size: 0.78em; color: #94a3b8; margin-bottom: 6px; }
  .history-item .hrv-badge { display: inline-block; background: #0369a1; color: white; border-radius: 20px; padding: 3px 12px; font-size: 0.85em; font-weight: 700; margin-bottom: 8px; }
  .history-item .adv { font-size: 0.85em; color: #475569; line-height: 1.7; margin-top: 6px; }

  .empty { text-align: center; padding: 40px 20px; color: #94a3b8; }
  .empty .icon { font-size: 3em; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="header">
  <h1>🌊 AIリカバリーコーチ</h1>
  <p id="headerDate">毎日の体の状態を記録・分析</p>
</div>

<div class="tabs">
  <div class="tab active" onclick="showPage('input', this)">今日の記録</div>
  <div class="tab" onclick="showPage('result', this)">AIアドバイス</div>
  <div class="tab" onclick="showPage('history', this)">履歴</div>
</div>

<!-- 入力ページ -->
<div class="page active" id="page-input">

  <div class="card" style="margin-top:14px">
    <h2>HRV・体の状態</h2>
    <div class="row2">
      <div class="field">
        <label>HRV</label>
        <input type="number" id="hrv" placeholder="例：63" inputmode="numeric">
      </div>
      <div class="field">
        <label>心拍数（HR）</label>
        <input type="number" id="hr" placeholder="例：62" inputmode="numeric">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>睡眠時間（時間）</label>
        <input type="number" id="sleep" placeholder="例：7" step="0.5" inputmode="decimal">
      </div>
      <div class="field">
        <label>だるさ</label>
        <select id="fatigue">
          <option value="なし">なし</option>
          <option value="少しあり">少しあり</option>
          <option value="あり">あり</option>
          <option value="かなりあり">かなりあり</option>
        </select>
      </div>
    </div>
    <div class="field" style="margin-bottom:0">
      <label>運動</label>
      <select id="exercise">
        <option value="なし">なし</option>
        <option value="サーフィン">サーフィン</option>
        <option value="ジム">ジム</option>
        <option value="ウォーキング">ウォーキング</option>
        <option value="その他">その他</option>
      </select>
    </div>
  </div>

  <!-- 朝食 -->
  <div class="card">
    <h2>🌅 朝食</h2>
    <div class="photo-area" id="photoArea_morning" onclick="document.getElementById('photo_morning').click()">
      <div class="icon">📷</div><p>写真を追加</p>
    </div>
    <input type="file" id="photo_morning" accept="image/*" capture="environment" onchange="previewPhoto(this,'photoArea_morning')" style="display:none">
    <div class="field" style="margin-top:8px;margin-bottom:0">
      <input type="text" id="memo_morning" placeholder="例：納豆ご飯、味噌汁">
    </div>
    <button class="btn-meal" id="btn_morning" onclick="recordMeal('morning')">朝食を記録する</button>
    <div id="result_morning"></div>
  </div>

  <!-- 昼食 -->
  <div class="card">
    <h2>☀️ 昼食</h2>
    <div class="photo-area" id="photoArea_lunch" onclick="document.getElementById('photo_lunch').click()">
      <div class="icon">📷</div><p>写真を追加</p>
    </div>
    <input type="file" id="photo_lunch" accept="image/*" capture="environment" onchange="previewPhoto(this,'photoArea_lunch')" style="display:none">
    <div class="field" style="margin-top:8px;margin-bottom:0">
      <input type="text" id="memo_lunch" placeholder="例：ざるそば、サラダ">
    </div>
    <button class="btn-meal" id="btn_lunch" onclick="recordMeal('lunch')">昼食を記録する</button>
    <div id="result_lunch"></div>
  </div>

  <!-- 夕食 -->
  <div class="card">
    <h2>🌙 夕食</h2>
    <div class="photo-area" id="photoArea_dinner" onclick="document.getElementById('photo_dinner').click()">
      <div class="icon">📷</div><p>写真を追加</p>
    </div>
    <input type="file" id="photo_dinner" accept="image/*" capture="environment" onchange="previewPhoto(this,'photoArea_dinner')" style="display:none">
    <div class="field" style="margin-top:8px;margin-bottom:0">
      <input type="text" id="memo_dinner" placeholder="例：魚定食、豆腐">
    </div>
    <button class="btn-meal" id="btn_dinner" onclick="recordMeal('dinner')">夕食を記録する</button>
    <div id="result_dinner"></div>
  </div>
</div>

<!-- 結果ページ -->
<div class="page" id="page-result">
  <div style="margin-top:14px" id="resultContent">
    <div class="empty">
      <div class="icon">🤖</div>
      <p>食事を記録すると<br>AIアドバイスが表示されます</p>
    </div>
  </div>
</div>

<!-- 履歴ページ -->
<div class="page" id="page-history">
  <div style="margin-top:14px" id="historyContent"></div>
</div>

<script>
const TODAY_KEY = 'recovery_' + new Date().toISOString().slice(0, 10);
const MEAL_LABELS = { morning: '朝食', lunch: '昼食', dinner: '夕食' };
const BTN_TEXTS = { morning: '朝食を記録する', lunch: '昼食を記録する', dinner: '夕食を記録する' };

window.addEventListener('load', () => {
  const d = new Date();
  document.getElementById('headerDate').textContent =
    d.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });
  loadTodayData();
});

function loadTodayData() {
  const saved = getTodayData();
  if (saved.hrv) document.getElementById('hrv').value = saved.hrv;
  if (saved.hr) document.getElementById('hr').value = saved.hr;
  if (saved.sleep) document.getElementById('sleep').value = saved.sleep;
  if (saved.fatigue) document.getElementById('fatigue').value = saved.fatigue;
  if (saved.exercise) document.getElementById('exercise').value = saved.exercise;
  ['morning', 'lunch', 'dinner'].forEach(meal => {
    if (saved[meal + '_summary']) showMealDone(meal, saved[meal + '_summary']);
  });
  if (saved.latest_advice) renderAdvice(saved);
}

function showPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if (el) el.classList.add('active');
  if (name === 'history') renderHistory();
}

function previewPhoto(input, areaId) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const area = document.getElementById(areaId);
    area.classList.add('has-image');
    area.innerHTML = `<img src="${ev.target.result}" alt="食事写真">`;
  };
  reader.readAsDataURL(file);
}

function getTodayData() {
  return JSON.parse(localStorage.getItem(TODAY_KEY) || '{}');
}

function saveTodayData(update) {
  const merged = { ...getTodayData(), ...update };
  localStorage.setItem(TODAY_KEY, JSON.stringify(merged));
  if (merged.latest_advice) updateHistory(merged);
}

function updateHistory(data) {
  const history = JSON.parse(localStorage.getItem('recovery_history') || '[]');
  const dateKey = new Date().toISOString().slice(0, 10);
  const entry = {
    dateKey, date: new Date().toISOString(),
    hrv: data.hrv, hr: data.hr, sleep: data.sleep,
    fatigue: data.fatigue, exercise: data.exercise,
    advice: data.latest_advice
  };
  const idx = history.findIndex(h => h.dateKey === dateKey);
  if (idx >= 0) history[idx] = entry;
  else history.unshift(entry);
  if (history.length > 90) history.pop();
  localStorage.setItem('recovery_history', JSON.stringify(history));
}

async function recordMeal(meal) {
  const btn = document.getElementById('btn_' + meal);
  const resultEl = document.getElementById('result_' + meal);

  btn.disabled = true;
  btn.textContent = '分析中...';
  btn.classList.remove('done');
  resultEl.innerHTML = `<div class="loading-inline"><div class="spinner-sm"></div><span style="font-size:0.85em;color:#64748b">AIが分析中...</span></div>`;

  const vitals = {
    hrv: document.getElementById('hrv').value,
    hr: document.getElementById('hr').value,
    sleep: document.getElementById('sleep').value,
    fatigue: document.getElementById('fatigue').value,
    exercise: document.getElementById('exercise').value,
  };
  saveTodayData(vitals);

  const saved = getTodayData();
  const formData = new FormData();
  Object.entries(vitals).forEach(([k, v]) => formData.append(k, v));

  // 今回の食事（写真 or テキスト）
  const photoFile = document.getElementById('photo_' + meal).files[0];
  if (photoFile) formData.append('food_' + meal, photoFile);
  formData.append('memo_' + meal, document.getElementById('memo_' + meal).value);

  // 既に記録済みの他の食事はテキストで渡す
  ['morning', 'lunch', 'dinner'].forEach(key => {
    if (key !== meal && saved[key + '_summary']) {
      formData.append('memo_' + key, saved[key + '_summary']);
    }
  });

  try {
    const res = await fetch('/api/analyze', { method: 'POST', body: formData });
    const data = await res.json();

    const thisMealLabel = MEAL_LABELS[meal];
    const mealData = data.meals.find(m => m.label === thisMealLabel);
    const summary = mealData ? mealData.summary
                  : document.getElementById('memo_' + meal).value || '記録済み';

    saveTodayData({ [meal + '_summary']: summary, latest_advice: data.advice });
    showMealDone(meal, summary);
    renderAdvice(getTodayData());

  } catch(err) {
    resultEl.innerHTML = `<p style="color:#e63946;font-size:0.85em;padding:8px 0">エラー: ${err.message}</p>`;
    btn.disabled = false;
    btn.textContent = BTN_TEXTS[meal];
  }
}

function showMealDone(meal, summary) {
  const btn = document.getElementById('btn_' + meal);
  const resultEl = document.getElementById('result_' + meal);
  btn.disabled = false;
  btn.textContent = `✓ ${MEAL_LABELS[meal]}を更新する`;
  btn.classList.add('done');
  resultEl.innerHTML = `
    <div class="meal-done-box">
      <div class="done-label">✓ 記録済み</div>
      <p>${summary}</p>
    </div>`;
}

function renderAdvice(data) {
  const today = new Date().toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });
  const tags = [];
  if (data.exercise && data.exercise !== 'なし') tags.push(data.exercise);
  if (data.fatigue && data.fatigue !== 'なし') tags.push(`だるさ：${data.fatigue}`);

  const mealEntries = [
    ['morning_summary', '🌅 朝食'],
    ['lunch_summary', '☀️ 昼食'],
    ['dinner_summary', '🌙 夕食'],
  ];
  const mealsHtml = mealEntries
    .filter(([key]) => data[key])
    .map(([key, label]) => `<div class="meal-result"><strong>${label}</strong><br>${data[key]}</div>`)
    .join('');

  document.getElementById('resultContent').innerHTML = `
    <div class="card">
      <div style="font-size:0.82em;color:#94a3b8;margin-bottom:8px">${today}</div>
      <div class="hrv-display">
        <div class="num">${data.hrv || '—'}</div>
        <div class="sub">HRV　睡眠 ${data.sleep || '—'}時間</div>
      </div>
      ${tags.length ? `<div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : ''}
    </div>
    ${mealsHtml ? `<div class="card"><h2>🥗 今日の食事</h2>${mealsHtml}</div>` : ''}
    <div class="advice-box">
      <div class="label">🤖 最新のアドバイス</div>
      <p>${data.latest_advice || ''}</p>
    </div>`;
}

function renderHistory() {
  const history = JSON.parse(localStorage.getItem('recovery_history') || '[]');
  const el = document.getElementById('historyContent');
  if (!history.length) {
    el.innerHTML = `<div class="empty"><div class="icon">📋</div><p>まだ記録がありません</p></div>`;
    return;
  }
  el.innerHTML = history.map(item => {
    const d = new Date(item.date);
    const dateStr = d.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });
    return `
      <div class="history-item">
        <div class="date">${dateStr}</div>
        <span class="hrv-badge">HRV ${item.hrv || '—'}</span>
        <span style="font-size:0.8em;color:#64748b;margin-left:8px">睡眠 ${item.sleep || '—'}時間 / ${item.exercise || 'なし'}</span>
        <div class="adv">${item.advice ? item.advice.substring(0, 120) + (item.advice.length > 120 ? '...' : '') : ''}</div>
      </div>`;
  }).join('');
}
</script>

</body>
</html>
